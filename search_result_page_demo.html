
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans)}
.page{padding:1rem 0}
.search-bar-wrap{display:flex;gap:8px;margin-bottom:1.25rem}
#searchInput{flex:1;padding:0 14px;height:40px;font-size:15px;border:1.5px solid var(--color-border-primary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);outline:none}
#searchInput:focus{border-color:#378ADD}
#btnSearch{padding:0 20px;height:40px;background:#378ADD;color:#fff;border:none;border-radius:var(--border-radius-md);font-size:14px;font-weight:500;cursor:pointer}
.result-meta{font-size:13px;color:var(--color-text-secondary);margin-bottom:1rem}
.result-meta span{color:var(--color-text-primary);font-weight:500}
.layout{display:flex;gap:1rem}
.sidebar{width:200px;flex-shrink:0}
.sidebar-section{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);padding:14px;margin-bottom:12px}
.sidebar-title{font-size:13px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.filter-option{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:14px;color:var(--color-text-primary)}
.filter-option input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:#378ADD}
.price-inputs{display:flex;gap:6px;align-items:center}
.price-input{width:75px;padding:5px 8px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.price-sep{font-size:12px;color:var(--color-text-tertiary)}
.star-row{display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer;font-size:13px;color:var(--color-text-primary)}
.stars{color:#EF9F27;letter-spacing:1px;font-size:14px}
.main{flex:1;min-width:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.sort-tabs{display:flex;gap:6px}
.sort-tab{padding:5px 12px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-secondary);cursor:pointer}
.sort-tab.active{background:#E6F1FB;border-color:#378ADD;color:#185FA5;font-weight:500}
.view-toggle{display:flex;gap:4px}
.view-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;color:var(--color-text-secondary);font-size:18px}
.view-btn.active{background:#E6F1FB;border-color:#378ADD;color:#185FA5}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.product-grid.list-view{grid-template-columns:1fr}
.product-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden;cursor:pointer;transition:border-color .15s}
.product-card:hover{border-color:var(--color-border-primary)}
.product-card.list-view{display:flex;gap:0}
.product-img{width:100%;aspect-ratio:1;background:var(--color-background-secondary);display:flex;align-items:center;justify-content:center;font-size:32px}
.product-card.list-view .product-img{width:100px;height:100px;flex-shrink:0;aspect-ratio:unset}
.product-info{padding:10px}
.product-card.list-view .product-info{padding:12px;flex:1;display:flex;flex-direction:column;justify-content:center}
.product-name{font-size:13px;color:var(--color-text-primary);line-height:1.4;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-card.list-view .product-name{-webkit-line-clamp:1;font-size:14px}
.product-price{font-size:15px;font-weight:500;color:#D85A30;margin-bottom:4px}
.product-sold{font-size:11px;color:var(--color-text-tertiary)}
.product-rating{font-size:11px;color:var(--color-text-secondary);display:flex;align-items:center;gap:3px}
.star-s{color:#EF9F27;font-size:11px}
.badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;margin-bottom:5px}
.badge-official{background:#EAF3DE;color:#3B6D11}
.badge-sale{background:#FAECE7;color:#993C1D}
.no-result{text-align:center;padding:3rem;color:var(--color-text-secondary);font-size:14px}
.highlight{background:#FAEEDA;color:#854F0B;padding:0 2px;border-radius:2px}
.pagination{display:flex;gap:6px;justify-content:center;margin-top:1.5rem}
.page-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);cursor:pointer;font-size:13px;color:var(--color-text-secondary)}
.page-btn.active{background:#378ADD;border-color:#378ADD;color:#fff;font-weight:500}
.active-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filter-tag{display:flex;align-items:center;gap:5px;padding:3px 10px;background:#E6F1FB;border:0.5px solid #B5D4F4;border-radius:20px;font-size:12px;color:#185FA5}
.filter-tag button{background:none;border:none;color:#185FA5;cursor:pointer;font-size:14px;line-height:1;padding:0}
</style>

<div class="page">
  <h2 class="sr-only">Demo halaman hasil pencarian produk</h2>

  <div class="search-bar-wrap">
    <input id="searchInput" type="text" placeholder="Cari produk..." value="sepatu" />
    <button id="btnSearch" onclick="doSearch()"><i class="ti ti-search" aria-hidden="true"></i> Cari</button>
  </div>

  <div class="result-meta" id="resultMeta"></div>
  <div class="active-filters" id="activeFilters"></div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-title">Kategori</div>
        <label class="filter-option"><input type="checkbox" value="sepatu" onchange="toggleFilter('category','Sepatu',this)"> Sepatu</label>
        <label class="filter-option"><input type="checkbox" value="pakaian" onchange="toggleFilter('category','Pakaian',this)"> Pakaian</label>
        <label class="filter-option"><input type="checkbox" value="tas" onchange="toggleFilter('category','Tas',this)"> Tas</label>
        <label class="filter-option"><input type="checkbox" value="aksesoris" onchange="toggleFilter('category','Aksesoris',this)"> Aksesoris</label>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Harga</div>
        <div class="price-inputs">
          <input class="price-input" id="priceMin" type="number" placeholder="Min" oninput="applyPriceFilter()">
          <span class="price-sep">–</span>
          <input class="price-input" id="priceMax" type="number" placeholder="Max" oninput="applyPriceFilter()">
        </div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-title">Rating</div>
        <div class="star-row" onclick="setRatingFilter(4)"><span class="stars">★★★★</span><span style="font-size:13px">& ke atas</span></div>
        <div class="star-row" onclick="setRatingFilter(3)"><span class="stars">★★★</span><span style="font-size:13px">& ke atas</span></div>
        <div class="star-row" onclick="setRatingFilter(0)"><span style="font-size:13px;color:var(--color-text-secondary)">Semua rating</span></div>
      </div>
    </div>

    <div class="main">
      <div class="toolbar">
        <div class="sort-tabs">
          <button class="sort-tab active" onclick="setSort('relevan',this)">Relevan</button>
          <button class="sort-tab" onclick="setSort('terlaris',this)">Terlaris</button>
          <button class="sort-tab" onclick="setSort('termurah',this)">Termurah</button>
          <button class="sort-tab" onclick="setSort('termahal',this)">Termahal</button>
          <button class="sort-tab" onclick="setSort('rating',this)">Rating</button>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="gridBtn" onclick="setView('grid')" aria-label="Grid view"><i class="ti ti-layout-grid" aria-hidden="true"></i></button>
          <button class="view-btn" id="listBtn" onclick="setView('list')" aria-label="List view"><i class="ti ti-list" aria-hidden="true"></i></button>
        </div>
      </div>
      <div class="product-grid" id="productGrid"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<script>
const products = [
  {id:1,name:"Sepatu Adidas Ultraboost 22 Running",category:"sepatu",price:1299000,sold:4821,rating:4.8,badge:"official",emoji:"👟"},
  {id:2,name:"Sepatu Nike Air Max 270 Original",category:"sepatu",price:1599000,sold:3102,rating:4.7,badge:"official",emoji:"👟"},
  {id:3,name:"Sepatu Sneakers Pria Casual Putih",category:"sepatu",price:249000,sold:9841,rating:4.5,badge:"sale",emoji:"👟"},
  {id:4,name:"Sepatu Lari Wanita Sport Ringan",category:"sepatu",price:389000,sold:2210,rating:4.3,badge:null,emoji:"👟"},
  {id:5,name:"Sepatu Boots Kulit Pria Premium",category:"sepatu",price:899000,sold:1540,rating:4.6,badge:"official",emoji:"👞"},
  {id:6,name:"Sepatu Sandal Wanita Tali",category:"sepatu",price:129000,sold:6720,rating:4.2,badge:null,emoji:"👡"},
  {id:7,name:"Sepatu Kets Anak Sekolah Putih",category:"sepatu",price:175000,sold:5200,rating:4.4,badge:"sale",emoji:"👟"},
  {id:8,name:"Sepatu Futsal Puma King Pro",category:"sepatu",price:699000,sold:880,rating:4.5,badge:null,emoji:"⚽"},
  {id:9,name:"Sepatu Slip On Pria Hitam",category:"sepatu",price:199000,sold:3300,rating:4.1,badge:null,emoji:"🥿"},
  {id:10,name:"Kaos Polos Cotton 30s Unisex",category:"pakaian",price:79000,sold:12000,rating:4.6,badge:"sale",emoji:"👕"},
  {id:11,name:"Tas Ransel Laptop Anti Air 15 inch",category:"tas",price:349000,sold:4100,rating:4.7,badge:null,emoji:"🎒"},
  {id:12,name:"Topi Baseball Cap Unisex",category:"aksesoris",price:89000,sold:2800,rating:4.3,badge:null,emoji:"🧢"},
];

let query = "sepatu";
let sortMode = "relevan";
let viewMode = "grid";
let activeCategories = new Set();
let minPrice = null, maxPrice = null;
let minRating = 0;
let currentPage = 1;
const PER_PAGE = 8;

function tokenize(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(t=>t.length>1)}

function scoreProduct(p, qTokens){
  let score = 0;
  const nTokens = tokenize(p.name);
  const catTokens = tokenize(p.category);
  const allTokens = [...nTokens,...catTokens];
  qTokens.forEach(qt=>{
    allTokens.forEach(nt=>{
      if(nt===qt) score+=10;
      else if(nt.startsWith(qt)) score+=6;
      else if(levenshtein(qt,nt)<=1 && qt.length>3) score+=3;
    });
  });
  score += Math.log(p.sold+1)*0.3;
  score += p.rating*0.5;
  return score;
}

function levenshtein(a,b){
  const dp=Array.from({length:a.length+1},(_,i)=>Array.from({length:b.length+1},(_,j)=>i||j));
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[a.length][b.length];
}

function highlightText(text, qTokens){
  let result = text;
  qTokens.forEach(qt=>{
    const re = new RegExp(`(${qt})`, 'gi');
    result = result.replace(re, '<span class="highlight">$1</span>');
  });
  return result;
}

function formatPrice(n){return 'Rp '+n.toLocaleString('id-ID')}

function getFiltered(){
  const qTokens = tokenize(query);
  let list = products.filter(p=>{
    const s = scoreProduct(p, qTokens);
    if(s <= 0) return false;
    if(activeCategories.size>0 && !activeCategories.has(p.category)) return false;
    if(minPrice && p.price < minPrice) return false;
    if(maxPrice && p.price > maxPrice) return false;
    if(p.rating < minRating) return false;
    return true;
  });

  if(sortMode==='relevan') list = list.sort((a,b)=>scoreProduct(b,qTokens)-scoreProduct(a,qTokens));
  else if(sortMode==='terlaris') list = list.sort((a,b)=>b.sold-a.sold);
  else if(sortMode==='termurah') list = list.sort((a,b)=>a.price-b.price);
  else if(sortMode==='termahal') list = list.sort((a,b)=>b.price-a.price);
  else if(sortMode==='rating') list = list.sort((a,b)=>b.rating-a.rating);
  return list;
}

function render(){
  const qTokens = tokenize(query);
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total/PER_PAGE);
  if(currentPage > totalPages) currentPage = 1;
  const paged = filtered.slice((currentPage-1)*PER_PAGE, currentPage*PER_PAGE);

  document.getElementById('resultMeta').innerHTML =
    total>0 ? `Menampilkan <span>${total} produk</span> untuk "<span>${query}</span>"` : '';

  const grid = document.getElementById('productGrid');
  grid.className = 'product-grid' + (viewMode==='list'?' list-view':'');

  if(paged.length===0){
    grid.innerHTML = `<div class="no-result" style="grid-column:1/-1"><i class="ti ti-mood-sad" style="font-size:32px;display:block;margin-bottom:8px" aria-hidden="true"></i>Produk tidak ditemukan<br><span style="font-size:12px">Coba kata kunci lain atau hapus filter</span></div>`;
  } else {
    grid.innerHTML = paged.map(p=>{
      const lv = viewMode==='list';
      const badge = p.badge==='official'?`<span class="badge badge-official">Toko Resmi</span>`
        :p.badge==='sale'?`<span class="badge badge-sale">Diskon</span>`:'';
      const stars = '★'.repeat(Math.floor(p.rating))+'☆'.repeat(5-Math.floor(p.rating));
      return `<div class="product-card${lv?' list-view':''}">
        <div class="product-img">${p.emoji}</div>
        <div class="product-info">
          ${badge}
          <div class="product-name">${highlightText(p.name, qTokens)}</div>
          <div class="product-price">${formatPrice(p.price)}</div>
          <div class="product-rating"><span class="star-s">${stars}</span> ${p.rating} &nbsp;·&nbsp; <span class="product-sold">${p.sold.toLocaleString('id-ID')} terjual</span></div>
        </div>
      </div>`;
    }).join('');
  }

  const pg = document.getElementById('pagination');
  if(totalPages<=1){pg.innerHTML='';return;}
  let btns='';
  for(let i=1;i<=totalPages;i++) btns+=`<button class="page-btn${i===currentPage?' active':''}" onclick="goPage(${i})">${i}</button>`;
  pg.innerHTML=btns;
}

function doSearch(){
  query = document.getElementById('searchInput').value.trim()||'sepatu';
  currentPage=1;
  render();
}

function setSort(mode,el){
  sortMode=mode;currentPage=1;
  document.querySelectorAll('.sort-tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function setView(v){
  viewMode=v;
  document.getElementById('gridBtn').classList.toggle('active',v==='grid');
  document.getElementById('listBtn').classList.toggle('active',v==='list');
  render();
}

function toggleFilter(type,label,el){
  if(type==='category'){
    const val=el.value;
    if(el.checked) activeCategories.add(val); else activeCategories.delete(val);
  }
  currentPage=1;
  renderActiveTags();
  render();
}

function applyPriceFilter(){
  minPrice=parseInt(document.getElementById('priceMin').value)||null;
  maxPrice=parseInt(document.getElementById('priceMax').value)||null;
  currentPage=1;render();
}

function setRatingFilter(r){
  minRating=r;currentPage=1;
  renderActiveTags();render();
}

function renderActiveTags(){
  const wrap=document.getElementById('activeFilters');
  let tags='';
  activeCategories.forEach(c=>{ tags+=`<span class="filter-tag">${c} <button onclick="removeFilter('cat','${c}')">×</button></span>`; });
  if(minRating>0) tags+=`<span class="filter-tag">Rating ≥${minRating}★ <button onclick="removeFilter('rating','')">×</button></span>`;
  wrap.innerHTML=tags;
}

function removeFilter(type,val){
  if(type==='cat'){
    activeCategories.delete(val);
    document.querySelectorAll('.filter-option input').forEach(i=>{if(i.value===val)i.checked=false;});
  }
  if(type==='rating') minRating=0;
  currentPage=1;renderActiveTags();render();
}

function goPage(n){currentPage=n;render();}

document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});

render();
</script>
